<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#271006" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Parolone 24" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Parolone 24</title>
  <style>
    :root{
      --cream:#fff1d2; --gold:#ffb01b; --gold2:#ffd36d; --ink:#241006;
      --brown:#4e2410; --sky:#8fdcff; --red:#ee4b4b; --green:#34a86b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    body{
      color:var(--cream); min-height:100svh; overflow-x:hidden;
      background:linear-gradient(#8fdcff 0 28%,#f3a34e 28% 53%,#8d3f1f 53% 100%);
    }
    button{font:inherit}
    .app{
      width:min(100%,520px); min-height:100svh; margin:auto;
      padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 18px);
      background:
        radial-gradient(ellipse at 18% 28%,rgba(255,255,255,.95) 0 7%,transparent 7.4%),
        radial-gradient(ellipse at 31% 25%,rgba(255,255,255,.9) 0 5%,transparent 5.4%),
        radial-gradient(ellipse at 84% 18%,rgba(255,255,255,.9) 0 6%,transparent 6.4%),
        linear-gradient(to bottom,rgba(143,220,255,.96) 0 34%,rgba(238,156,69,.97) 34% 54%,rgba(72,30,13,.99) 54%);
    }
    .screen{display:none;min-height:calc(100svh - 30px);flex-direction:column}
    .screen.active{display:flex;animation:fade .2s ease}
    @keyframes fade{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}

    .brand{font-family:Georgia,serif;font-weight:900;font-size:45px;line-height:1;text-align:center;color:#2d1208;margin-top:10px}
    .brand b{color:#f3a400}
    .subtitle{text-align:center;color:#2d1208;font-weight:750;margin-top:8px}
    .desert-card{
      margin:16px 0 8px;border-radius:28px;overflow:hidden;position:relative;min-height:330px;
      box-shadow:0 20px 45px rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.3);
      background:
        linear-gradient(170deg,transparent 0 47%,#d85e32 48% 59%,transparent 60%),
        linear-gradient(15deg,transparent 0 52%,#b4472d 53% 65%,transparent 66%),
        linear-gradient(#8edbff 0 55%,#eab04e 55% 100%);
    }
    .sun{position:absolute;right:28px;top:24px;width:64px;height:64px;border-radius:50%;background:#ffe56c;box-shadow:0 0 35px rgba(255,229,108,.65)}
    .mesa{position:absolute;left:-20px;bottom:88px;width:210px;height:80px;background:#bd5736;clip-path:polygon(0 100%,15% 42%,28% 42%,36% 10%,67% 10%,73% 49%,100% 49%,100% 100%)}
    .mesa.m2{left:auto;right:-8px;width:170px;height:95px;background:#ce6b3d;transform:scaleX(-1)}
    .ground{position:absolute;left:0;right:0;bottom:0;height:110px;background:#e8ad4b}
    .mailbox{
      position:absolute;right:26px;bottom:86px;width:128px;height:82px;background:#f9f4e9;border:4px solid #2e1a11;border-radius:42px 42px 10px 10px;
    }
    .mailbox:after{content:"COYOTE";position:absolute;left:22px;top:32px;font-family:Georgia,serif;font-weight:900;color:#1f120c;font-size:19px}
    .maildoor{position:absolute;right:-2px;bottom:-55px;width:82px;height:54px;background:#f9f4e9;border:4px solid #2e1a11;border-top:0;border-radius:0 0 14px 14px;transform:skewY(-8deg)}
    .post{position:absolute;right:79px;bottom:-100px;width:21px;height:104px;background:#4b2a19}
    .flag{position:absolute;right:4px;top:-52px;width:8px;height:58px;background:#2e1a11}
    .flag:after{content:"";position:absolute;left:0;top:0;width:36px;height:25px;background:#e22a26;border:3px solid #2e1a11;border-radius:3px}
    .coyote{
      position:absolute;left:24px;bottom:45px;width:205px;height:245px;filter:drop-shadow(0 10px 7px rgba(0,0,0,.25));
    }
    .ear{position:absolute;top:1px;width:50px;height:98px;background:#a65e30;border:5px solid #412313;border-radius:75% 15% 70% 20%;z-index:1}
    .ear:after{content:"";position:absolute;inset:12px 10px 22px;background:#efac8a;border-radius:70% 15% 70% 20%}
    .ear.l{left:43px;transform:rotate(-12deg)} .ear.r{right:40px;transform:scaleX(-1) rotate(-12deg)}
    .head{position:absolute;left:40px;top:58px;width:145px;height:130px;background:#a65e30;border:5px solid #412313;border-radius:47%;z-index:3}
    .cream{position:absolute;left:36px;top:69px;width:95px;height:52px;background:#f4d2a3;border-radius:52%;z-index:5}
    .nose{position:absolute;right:-13px;top:9px;width:34px;height:29px;border-radius:50%;background:#111;box-shadow:inset 6px 4px 0 rgba(255,255,255,.15)}
    .eye{position:absolute;top:29px;width:44px;height:58px;border-radius:50%;background:#ffe44e;border:4px solid #412313;z-index:6}
    .eye.l{left:25px}.eye.r{right:24px}.pupil{position:absolute;left:19px;top:24px;width:8px;height:13px;background:#18100c;border-radius:50%}
    .brow{position:absolute;top:22px;width:40px;height:8px;border-radius:50%;background:#342015;z-index:7}
    .brow.l{left:20px;transform:rotate(-9deg)} .brow.r{right:20px;transform:rotate(9deg)}
    .smile{position:absolute;left:47px;top:94px;width:75px;height:28px;border-bottom:7px solid #4a2313;border-radius:0 0 70% 70%;z-index:8}
    .body{position:absolute;left:70px;top:173px;width:72px;height:70px;background:#9a562d;border:5px solid #412313;border-radius:45% 45% 24% 24%;z-index:2}
    .chest{position:absolute;left:19px;top:5px;width:33px;height:58px;background:#f1ce9a;border-radius:50%;z-index:3}
    .arm{position:absolute;width:65px;height:17px;background:#9a562d;border:4px solid #412313;border-radius:20px;z-index:4}
    .arm.left{left:29px;top:184px;transform:rotate(125deg)} .arm.right{right:3px;top:175px;transform:rotate(8deg)}
    .leg{position:absolute;width:18px;height:70px;background:#9a562d;border:4px solid #412313;border-radius:20px;top:211px;z-index:1}
    .leg.l{left:72px;transform:rotate(11deg)} .leg.r{left:118px;transform:rotate(-8deg)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
    .stat{background:rgba(255,243,216,.96);color:#271006;border-radius:18px;padding:10px 5px;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.18)}
    .stat strong{display:block;font-size:22px}.stat span{font-size:10px;font-weight:750}.stat .ico{font-size:19px}
    .primary{border:0;width:100%;border-radius:999px;background:linear-gradient(var(--gold2),var(--gold));color:#251006;font-size:20px;font-weight:900;padding:17px 20px;box-shadow:0 12px 25px rgba(0,0,0,.18)}
    .secondary{border:0;background:transparent;color:#fff1d2;padding:11px;font-weight:750}
    .status{text-align:center;font-size:12px;color:rgba(255,241,210,.8);min-height:16px;margin:9px 0}
    .topbar{display:grid;grid-template-columns:44px 1fr 78px;align-items:center;color:#fff1d2;margin-top:5px}
    .topbar h2{text-align:center;font-family:Georgia,serif;font-size:19px;margin:0}
    .round{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(60,24,8,.45);color:#fff1d2;font-size:22px}
    .timer{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:900;color:#fff1d2;background:#2d150a;border:6px solid var(--gold);justify-self:end}
    .timer.danger{border-color:#ef4444;color:#fff}
    .quiz-coyote{position:relative;margin:2px auto -4px;width:130px;height:120px;transform:scale(.65);transform-origin:center bottom}
    .life{margin:0 auto 11px;background:rgba(43,17,6,.84);border-radius:999px;padding:9px 16px;display:flex;gap:10px;align-items:center;width:max-content;font-weight:800}
    .heart{font-size:23px}.heart.off{opacity:.25;filter:grayscale(1)}
    .question{background:rgba(255,242,211,.97);color:#241006;border-radius:28px;padding:17px 15px;box-shadow:0 16px 35px rgba(0,0,0,.25)}
    .question h1{text-align:center;font-family:Georgia,serif;font-size:31px;line-height:1.05;margin:0 0 13px}
    .option{width:100%;border:1px solid rgba(34,16,6,.18);background:rgba(255,255,255,.58);color:#241006;border-radius:999px;min-height:50px;margin:7px 0;padding:8px 11px;font-size:17px;font-weight:850}
    .option.correct{background:rgba(52,168,107,.28);border-color:#34a86b}
    .option.wrong{background:rgba(238,75,75,.22);border-color:#ee4b4b}
    .option:disabled{opacity:1}
    .result-title{font-family:Georgia,serif;text-align:center;font-size:48px;margin:58px 0 6px}
    .result-sub{text-align:center;font-size:20px;font-weight:800;color:rgba(255,241,210,.85)}
    .result-coyote{position:relative;height:270px;transform:rotate(85deg) scale(.86);margin:0 auto -10px;width:205px}
    .result-note{text-align:center;font-weight:800;margin:8px 14px 18px;line-height:1.35}
    .spacer{flex:1}
    .tiny{text-align:center;font-size:10px;color:rgba(255,241,210,.55);margin-top:7px}
    @media(max-height:730px){
      .desert-card{min-height:275px}.coyote{transform:scale(.83);transform-origin:left bottom}
      .stats{margin:5px 0}.stat{padding:7px 4px}.result-title{margin-top:30px}
      .question h1{font-size:27px}.option{min-height:44px;margin:5px 0}
    }
  </style>
</head>
<body>
<main class="app">

<section id="home" class="screen active">
  <div class="brand">Parolone <b>24</b></div>
  <div class="subtitle">Le parole più lunghe del giorno</div>

  <div class="desert-card">
    <div class="sun"></div><div class="mesa"></div><div class="mesa m2"></div><div class="ground"></div>
    <div class="mailbox"><div class="maildoor"></div><div class="post"></div><div class="flag"></div></div>
    <div class="coyote">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="head">
        <div class="eye l"><div class="pupil"></div></div><div class="eye r"><div class="pupil"></div></div>
        <div class="brow l"></div><div class="brow r"></div>
        <div class="cream"><div class="nose"></div></div><div class="smile"></div>
      </div>
      <div class="body"><div class="chest"></div></div><div class="arm left"></div><div class="arm right"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="ico">📰</div><strong>5</strong><span>domande</span></div>
    <div class="stat"><div class="ico">☷</div><strong>5</strong><span>opzioni</span></div>
    <div class="stat"><div class="ico">⏱️</div><strong>3</strong><span>secondi</span></div>
    <div class="stat"><div class="ico">❤️</div><strong>⅓</strong><span>vita/errore</span></div>
  </div>

  <div class="spacer"></div>
  <button id="startBtn" class="primary" disabled>Inizia la sfida →</button>
  <div id="status" class="status">Cerco parole casuali nei titoli del Sole 24 Ore…</div>
  <button id="refreshBtn" class="secondary">Cambia parole</button>
  <div class="tiny">Prototipo personale non ufficiale. Fonte: titoli dei feed RSS pubblici de Il Sole 24 Ore.</div>
</section>

<section id="quiz" class="screen">
  <div class="topbar">
    <button id="backBtn" class="round">‹</button>
    <h2 id="qnum">Domanda 1 di 5</h2>
    <div id="timer" class="timer">3.0</div>
  </div>

  <div class="quiz-coyote">
    <div class="coyote">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="head">
        <div class="eye l"><div class="pupil"></div></div><div class="eye r"><div class="pupil"></div></div>
        <div class="brow l"></div><div class="brow r"></div>
        <div class="cream"><div class="nose"></div></div><div class="smile"></div>
      </div><div class="body"><div class="chest"></div></div>
    </div>
  </div>

  <div id="life" class="life"></div>
  <div class="question">
    <h1>Qual è la parola<br>più lunga?</h1>
    <div id="options"></div>
  </div>
  <div class="spacer"></div>
</section>

<section id="result" class="screen">
  <div id="resultTitle" class="result-title">Game Over</div>
  <div id="resultSub" class="result-sub"></div>

  <div class="result-coyote">
    <div class="coyote">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="head">
        <div class="eye l"><div class="pupil"></div></div><div class="eye r"><div class="pupil"></div></div>
        <div class="brow l"></div><div class="brow r"></div>
        <div class="cream"><div class="nose"></div></div><div class="smile"></div>
      </div><div class="body"><div class="chest"></div></div>
    </div>
  </div>

  <div id="lifeResult" class="life"></div>
  <div id="resultNote" class="result-note"></div>
  <div class="spacer"></div>
  <button id="retryBtn" class="primary">↻ Riprova con altre parole</button>
  <button id="homeBtn" class="secondary">Torna alla home</button>
</section>

</main>

<script>
const FEEDS=[
 "https://www.ilsole24ore.com/rss/italia.xml",
 "https://www.ilsole24ore.com/rss/mondo.xml",
 "https://www.ilsole24ore.com/rss/economia.xml",
 "https://www.ilsole24ore.com/rss/finanza.xml",
 "https://www.ilsole24ore.com/rss/tecnologia.xml"
];

const FALLBACK=[
 "internazionalizzazione","decarbonizzazione","ricapitalizzazione","regolamentazione",
 "digitalizzazione","industrializzazione","infrastrutturazione","riorganizzazione",
 "sottocapitalizzazione","specializzazione","razionalizzazione","liberalizzazione",
 "globalizzazione","privatizzazione","commercializzazione","modernizzazione",
 "ristrutturazione","programmazione","diversificazione","sostenibilita",
 "competitivita","produttivita","obbligazionario","macroeconomia","geopolitica"
];

const STOP=new Set(["della","delle","dello","degli","dalla","dalle","dallo","dagli","nella","nelle","nello","negli","sulla","sulle","sullo","sugli","anche","come","sono","dopo","prima","contro","senza","verso","questo","questa","questi","queste","quello","quella","quelli","perche","mentre","dove","quando","oltre","ancora","molto","tutti","tutte","nuovo","nuova","anni","oggi","ieri","domani","italia","italiano","italiana","sole","euro","milioni","miliardi","secondo","parte","primo"]);

let questions=[],current=0,lives=3,locked=false,timerId=null,deadline=0;

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pretty(w){return w.charAt(0).toUpperCase()+w.slice(1)}
function renderLife(el,n){el.innerHTML='<b>Vite</b>'+[0,1,2].map(i=>`<span class="heart ${i<n?'':'off'}">♥</span>`).join('')}

function normalize(w){return w.toLocaleLowerCase("it-IT").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

function mutateOneLetter(word){
  const letters="abcdefghijklmnopqrstuvwxyz";
  let tries=0;
  while(tries++<100){
    const arr=[...word];
    const i=Math.floor(Math.random()*arr.length);
    const original=arr[i].toLowerCase();
    let c=letters[Math.floor(Math.random()*letters.length)];
    if(c===original) continue;
    arr[i]=c;
    const candidate=arr.join("");
    if(candidate!==word) return candidate;
  }
  return word.slice(0,-1)+(word.endsWith("a")?"e":"a");
}

function oneLetterOptions(answer){
  const base=answer.toLowerCase();
  const set=new Set([base]);
  while(set.size<5){
    let c=mutateOneLetter(base);
    if(c.length===base.length) set.add(c);
  }
  return shuffle([...set].map(pretty));
}

function makeQuestion(answer){
  return {answer:pretty(answer.toLowerCase()),options:oneLetterOptions(answer)};
}

function fallbackQuestions(){
  return shuffle(FALLBACK).slice(0,5).map(makeQuestion);
}

function parseRSS(text){
  const doc=new DOMParser().parseFromString(text,"text/xml");
  if(doc.querySelector("parsererror")) throw new Error("rss");
  return [...doc.querySelectorAll("item")].map(i=>({
    title:i.querySelector("title")?.textContent?.trim()||"",
    date:i.querySelector("pubDate")?.textContent?.trim()||""
  })).filter(x=>x.title);
}

async function fetchText(url){
  const attempts=[url,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
  let e;
  for(const endpoint of attempts){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),6500);
      const r=await fetch(endpoint,{cache:"no-store",signal:c.signal});
      clearTimeout(t);
      if(r.ok)return await r.text();
      e=new Error("http");
    }catch(err){e=err}
  }
  throw e||new Error("feed");
}

function extractWords(titles){
  const out=[];
  for(const t of titles){
    const words=normalize(t).match(/[a-z]+/g)||[];
    for(const w of words) if(w.length>=9 && w.length<=24 && !STOP.has(w)) out.push(w);
  }
  return [...new Set(out)];
}

async function loadQuestions(){
  $("startBtn").disabled=true;
  $("status").textContent="Cerco 5 parole casuali nei titoli del Sole 24 Ore…";
  try{
    const settled=await Promise.allSettled(FEEDS.map(async u=>parseRSS(await fetchText(u))));
    const items=settled.filter(x=>x.status==="fulfilled").flatMap(x=>x.value);
    const words=extractWords(items.map(x=>x.title));
    if(words.length<5) throw new Error("few");
    questions=shuffle(words).slice(0,5).map(makeQuestion);
    $("status").textContent="Pronte 5 parole nuove ✓";
  }catch(e){
    questions=fallbackQuestions();
    $("status").textContent="Feed non disponibile: uso 5 parole demo casuali";
  }
  $("startBtn").disabled=false;
}

function startGame(){
  clearInterval(timerId);current=0;lives=3;locked=false;show("quiz");renderQuestion();
}

function renderQuestion(){
  clearInterval(timerId);locked=false;
  $("qnum").textContent=`Domanda ${current+1} di 5`;
  renderLife($("life"),lives);
  const q=questions[current];
  $("options").innerHTML="";
  q.options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="option";b.textContent=opt;b.onclick=()=>answer(opt,b,false);$("options").appendChild(b);
  });
  deadline=performance.now()+3000;
  updateTimer();
  timerId=setInterval(updateTimer,50);
}

function updateTimer(){
  const remaining=Math.max(0,deadline-performance.now());
  $("timer").textContent=(remaining/1000).toFixed(1);
  $("timer").classList.toggle("danger",remaining<1000);
  if(remaining<=0){clearInterval(timerId);timeoutAnswer()}
}

function timeoutAnswer(){
  if(locked)return; locked=true; lives=Math.max(0,lives-1);
  const q=questions[current];
  [...document.querySelectorAll(".option")].forEach(b=>{
    if(b.textContent===q.answer)b.classList.add("correct");
    b.disabled=true;
  });
  renderLife($("life"),lives);
  setTimeout(nextStep,650);
}

function answer(opt,btn){
  if(locked)return; locked=true;clearInterval(timerId);
  const q=questions[current],correct=opt===q.answer;
  if(!correct){lives=Math.max(0,lives-1);btn.classList.add("wrong")}
  [...document.querySelectorAll(".option")].forEach(b=>{
    if(b.textContent===q.answer)b.classList.add("correct");b.disabled=true;
  });
  renderLife($("life"),lives);
  setTimeout(nextStep,650);
}

function nextStep(){
  if(lives===0){finish(false);return}
  if(current===4){finish(true);return}
  current++;renderQuestion();
}

function finish(completed){
  clearInterval(timerId);show("result");renderLife($("lifeResult"),lives);
  if(completed){
    $("resultTitle").textContent="Sfida completata!";
    $("resultSub").textContent=`Hai finito 5 domande con ${lives}/3 vite`;
    $("resultNote").textContent=lives===3?"Perfetto: nessun errore.":lives===2?"Molto bene: un solo errore.":"Salva per un soffio: una sola vita rimasta.";
  }else{
    $("resultTitle").textContent="Game Over";
    $("resultSub").textContent="Hai perso 3/3 vite";
    $("resultNote").textContent="Tre errori (o tre timeout): il coyote è ko.";
  }
}

$("startBtn").onclick=startGame;
$("retryBtn").onclick=async()=>{await loadQuestions();startGame()};
$("homeBtn").onclick=()=>show("home");
$("backBtn").onclick=()=>{clearInterval(timerId);show("home")};
$("refreshBtn").onclick=loadQuestions;

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
loadQuestions();
</script>
</body>
</html>
